name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # Every night at 03:00 UTC (04:00 in Poland in winter, 05:00 in summer).
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, format and type check
        run: |
          npm run lint
          npm run format:check
          npm run tsc:check
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # The app on Render's free plan sleeps when unused and needs up to a minute to start.
      - name: Wake up the application
        run: |
          for attempt in $(seq 1 12); do
            if curl -sf -o /dev/null --max-time 20 "$BASE_URL/api/docs-json"; then
              echo "Application is up."
              exit 0
            fi
            echo "Waiting for the application (attempt $attempt)..."
            sleep 10
          done
          echo "::warning::Application did not respond – tests may fail."
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # The Allure report is public – traces record what was typed, including the password.
      - name: Remove traces and videos from Allure results
        if: ${{ !cancelled() }}
        run: node scripts/strip-allure-attachments.mjs allure-results
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  # Publishes the Allure dashboard to GitHub Pages after every run on main (also when tests fail).
  report:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Download history of previous runs
        run: |
          mkdir -p allure-history
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.jsonl"
          if curl -sfL "$url" -o history.tmp; then
            mv history.tmp allure-history/history.jsonl
          else
            echo "No previous history found – this is the first report."
          fi
      - name: Generate Allure report
        run: npx allure generate allure-results
      - name: Publish history together with the report
        run: cp allure-history/history.jsonl allure-report/history.jsonl
      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v5
